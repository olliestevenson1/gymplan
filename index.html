<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>gymplan</title>
  <meta name="description" content="HHF 12 Week Turnover lift log">
  <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1526" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="gymplan">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="mark">gymplan</div>
      <div class="date" id="date"></div>
    </header>
    <div class="week" id="week"></div>
    <main id="train" style="display:flex;flex-direction:column;gap:16px"></main>
    <main id="progress" style="display:flex;flex-direction:column;gap:12px" hidden></main>
    <main id="games" style="display:flex;flex-direction:column;gap:12px" hidden></main>
    <main id="backup" style="display:flex;flex-direction:column;gap:12px" hidden></main>
  </div>

  <div class="timer" id="timer" aria-live="polite">
    <div class="timer-in">
      <div class="clock num" id="t-clock">0:00</div>
      <div class="what"><b id="t-next">Rest</b><span id="t-sub"></span></div>
      <button id="t-plus">+15s</button>
      <button id="t-done">Done</button>
      <div class="prog" id="t-prog"></div>
    </div>
  </div>

  <nav class="tabs" aria-label="Sections">
    <button data-view="train" aria-selected="true">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
    <button data-view="progress" aria-selected="false">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progress</button>
    <button data-view="games" aria-selected="false">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-35 12 12)"/><path d="M9.5 14.5l5-5M10.5 11.5l2 2M12 10l2 2"/></svg>Games</button>
    <button data-view="backup" aria-selected="false">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Backup</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
